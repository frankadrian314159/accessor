[workspace]
resolver = "2"
members = ["crates/accessor-core", "crates/accessor-cli", "crates/accessor-gui", "crates/accessor-capi",
    "crates/accessor-slt", "crates/accessor-pgreg", "crates/accessor-mtr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", features = ["alloc"] }
crc32fast = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
