[package]
name = "accessor-capi"
description = "C interface to the Accessor embedded database"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "accessor_capi"
# cdylib: accessor_capi.dll / libaccessor_capi.so. staticlib: for linking into C programs.
# rlib: so that the fuzz targets and the Rust tests can call the same functions.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
accessor-core = { path = "../accessor-core" }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
tempfile.workspace = true
