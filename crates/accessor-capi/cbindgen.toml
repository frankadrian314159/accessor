language = "C"
include_guard = "ACCESSOR_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
after_includes = """
/** A text length meaning "the text is NUL-terminated". */
#define ACC_NTS ((size_t)-1)"""
tab_width = 4
usize_is_size_t = true
style = "type"
header = """/*
 * accessor.h - the C interface to Accessor, an embedded relational database.
 *
 * Generated by cbindgen from crates/accessor-capi/src/lib.rs. Do not edit by hand.
 *
 * Conventions
 *   - Every function that can fail returns an int: ACC_OK (0) or an ACC_ERR_* code.
 *     acc_errcode() and acc_errmsg() give the code and text of the last failure on a connection.
 *   - Text is UTF-8. Where a function takes (const char *text, size_t len), pass the length in bytes,
 *     or ACC_NTS ((size_t)-1) if the text is NUL-terminated.
 *   - Strings returned by the library belong to the object they came from (a result, a statement, the
 *     library itself) and stay valid until that object is freed or closed.
 *   - A connection may be used from any thread; calls on one connection are carried out one at a time.
 *     Statements and results are not thread-safe: use each from one thread at a time.
 *   - Handles must be passed to the matching free/close function exactly once. NULL is always accepted
 *     by the free/close functions, and is rejected (ACC_ERR_MISUSE) by the others.
 */"""

[export]
include = []

[parse]
parse_deps = false

[enum]
prefix_with_name = false

[const]
allow_static_const = true
